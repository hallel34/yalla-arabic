<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בדיקת הקלטות - יאללה ערבית</title>
<style>
body{margin:0;background:#EDF2EF;color:#132523;font-family:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:8px 0 4px}
p.lead{color:#5A6E6A;font-size:15px;margin:0 0 18px}
.row{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1px solid #D3DDD8;border-radius:14px;
  padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer;text-align:start}
.row .ar{font-family:"Noto Naskh Arabic",serif;font-size:26px;flex:1}
.row .he{font-size:14px;color:#5A6E6A}
.row .he small{color:#93A7A2}
.row .ic{color:#0B6E6A;font-size:20px}
.row.played{border-color:#0B6E6A;background:#CFE8E3}
.row.played .ic{color:#2B8752}
#done{display:none;margin-top:18px;background:#DDF1E4;border:1px solid #2B8752;color:#2B8752;
  border-radius:14px;padding:14px 16px;font-weight:700;text-align:center}
#status{margin-top:14px;text-align:center;color:#5A6E6A;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>בדיקת הקלטות &#127911;</h1>
  <p class="lead">לחיצה על כל מילה משמיעה הקלטה מהאתר - בלי קול ההקראה של הטלפון. אם שומעים את כל החמש, הפתרון עובד.</p>
      <button class="row" data-src="audio/marhaba.mp3">
        <span class="ar">مَرْحَبا</span>
        <span class="he">שלום <small>(מַרְחַבָּא)</small></span>
        <span class="ic">&#9654;</span>
      </button>
      <button class="row" data-src="audio/ahlan.mp3">
        <span class="ar">أَهْلا</span>
        <span class="he">היי, ברוך הבא <small>(אַהְלָא)</small></span>
        <span class="ic">&#9654;</span>
      </button>
      <button class="row" data-src="audio/sabah-alkheir.mp3">
        <span class="ar">صَباح الخير</span>
        <span class="he">בוקר טוב <small>(צַבָּאח אִל-ח׳יר)</small></span>
        <span class="ic">&#9654;</span>
      </button>
      <button class="row" data-src="audio/sabah-annur.mp3">
        <span class="ar">صَباح النّور</span>
        <span class="he">בוקר אור (תשובה) <small>(צַבָּאח אִ-נּוּר)</small></span>
        <span class="ic">&#9654;</span>
      </button>
      <button class="row" data-src="audio/masa-alkheir.mp3">
        <span class="ar">مَسا الخير</span>
        <span class="he">ערב טוב <small>(מַסָא אִל-ח׳יר)</small></span>
        <span class="ic">&#9654;</span>
      </button>
  <div id="done">שמעת את כל חמש המילים - ההקלטות עובדות בטלפון &#127881;</div>
  <div id="status"></div>
</div>
<script>
const player=new Audio(); const played=new Set(); const rows=[...document.querySelectorAll('.row')];
const st=document.getElementById('status');
rows.forEach(b=>b.addEventListener('click',()=>{
  player.pause(); player.src=b.dataset.src; player.currentTime=0;
  player.play().then(()=>{st.textContent='מתנגן...';}).catch(e=>{st.textContent='ההשמעה נחסמה: '+e.message;});
  b.classList.add('played'); played.add(b.dataset.src);
  b.querySelector('.ic').innerHTML='&#10004;';
  if(played.size===rows.length) document.getElementById('done').style.display='block';
}));
player.addEventListener('ended',()=>{st.textContent='';});
</script>
</body>
</html>
